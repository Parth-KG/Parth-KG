<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380"
     role="img" aria-label="Parth Krishan Goswami. I check whether the number is real. A bar chart from neuroscan-ood showing brain-tumour classifier accuracy falling from 96.0 percent on a leaky split to 90.2 grouped, 66.4 corrupted and 38.5 under noise.">
  <title>Parth Krishan Goswami — I check whether the number is real.</title>
  <style>
    .name   { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:46px; font-weight:700; letter-spacing:2.6px; }
    .tag    { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:21px; font-weight:400; letter-spacing:0.1px; }
    .eyebrow{ font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size:11px;   letter-spacing:2.2px; }
    .meta   { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size:12.5px; letter-spacing:0.2px; }
    .micro  { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size:10.5px; letter-spacing:0.6px; }
    .val    { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size:14px; font-weight:600; letter-spacing:0.4px; }
    .cap    { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size:11px; letter-spacing:0.3px; }
    .punch  { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size:11.5px; font-weight:600; letter-spacing:0.8px; }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes fade { from { opacity: 0; } }
      .bar     { animation: rise .75s cubic-bezier(.16,1,.3,1) backwards; }
      .val     { animation: fade .5s ease-out .55s backwards; }
      .refline { animation: fade .6s ease-out .1s backwards; }
    }
  </style>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="18" fill="#0b0f14" stroke="#1e2732" stroke-width="1.5"/>
  <text x="56" y="54" class="eyebrow" fill="#8593a4">GITHUB.COM/PARTH-KG</text>
  <text x="56" y="130" class="name" fill="#e9eff6">PARTH KRISHAN</text>
  <text x="56" y="186" class="name" fill="#e9eff6">GOSWAMI</text>
  <rect x="56" y="212" width="96" height="3" rx="1.5" fill="#f0b429"/>
  <text x="56" y="256" class="tag" fill="#e9eff6">I check whether the number is real.</text>
  <text x="56" y="294" class="meta" fill="#8593a4">B.Tech IT (AI/ML)  ·  Research Intern, DRDO / SSPL  ·  Delhi NCR</text>
  <text x="56" y="316" class="meta" fill="#8593a4">First author  ·  DOI 10.5281/zenodo.20084689</text>
  <text x="1144.0" y="54" class="eyebrow" text-anchor="end" fill="#8593a4">NEUROSCAN-OOD · FIG. 1</text>
  <text x="1144.0" y="74" class="micro" text-anchor="end" fill="#8593a4" opacity="0.8">one classifier, four honest evaluations</text>
  <line x1="700.0" y1="122.0" x2="1144.0" y2="122.0" stroke="#4dd0e1" stroke-width="1" stroke-dasharray="3 5" opacity="0.85" class="refline"/>
  <text x="1144.0" y="113.0" class="micro" text-anchor="end" fill="#4dd0e1">what the benchmark reports</text>
  <rect class="bar" x="726.0" y="122.0" width="70.0" height="190.0" rx="2" fill="#f0b429" opacity="1.00" style="transform-origin:761.0px 312.0px;animation-delay:0.10s"/>
  <text x="761.0" y="143.0" class="val" text-anchor="middle" fill="#0b0f14">96.0</text>
  <text x="761.0" y="336" class="cap" text-anchor="middle" fill="#8593a4">leaky split</text>
  <rect x="838.0" y="122.0" width="70.0" height="11.5" fill="#f0b429" fill-opacity="0.055" stroke="#2b3541" stroke-width="1" stroke-dasharray="2 4"/>
  <rect class="bar" x="838.0" y="133.5" width="70.0" height="178.5" rx="2" fill="#f0b429" opacity="0.91" style="transform-origin:873.0px 312.0px;animation-delay:0.20s"/>
  <text x="873.0" y="154.5" class="val" text-anchor="middle" fill="#0b0f14">90.2</text>
  <text x="873.0" y="336" class="cap" text-anchor="middle" fill="#8593a4">grouped split</text>
  <rect x="950.0" y="122.0" width="70.0" height="58.6" fill="#f0b429" fill-opacity="0.055" stroke="#2b3541" stroke-width="1" stroke-dasharray="2 4"/>
  <rect class="bar" x="950.0" y="180.6" width="70.0" height="131.4" rx="2" fill="#f0b429" opacity="0.82" style="transform-origin:985.0px 312.0px;animation-delay:0.30s"/>
  <text x="985.0" y="201.6" class="val" text-anchor="middle" fill="#0b0f14">66.4</text>
  <text x="985.0" y="336" class="cap" text-anchor="middle" fill="#8593a4">corrupted</text>
  <rect x="1062.0" y="122.0" width="70.0" height="113.8" fill="#f0b429" fill-opacity="0.055" stroke="#2b3541" stroke-width="1" stroke-dasharray="2 4"/>
  <rect class="bar" x="1062.0" y="235.8" width="70.0" height="76.2" rx="2" fill="#f0b429" opacity="0.73" style="transform-origin:1097.0px 312.0px;animation-delay:0.40s"/>
  <text x="1097.0" y="256.8" class="val" text-anchor="middle" fill="#0b0f14">38.5</text>
  <text x="1097.0" y="336" class="cap" text-anchor="middle" fill="#8593a4">noise</text>
  <line x1="700.0" y1="312.0" x2="1144.0" y2="312.0" stroke="#242d38" stroke-width="1.5"/>
  <text x="1144.0" y="358" class="punch" text-anchor="end" fill="#f0b429">96.0 → 38.5   − 57.5 points of reported accuracy</text>
</svg>
